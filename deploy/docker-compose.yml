services:
  # Postgres доступен только ядру: сеть db_net внутренняя (без выхода наружу), боты в неё не попадают.
  db:
    image: postgres:16-alpine
    container_name: bothub-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: db.env
    networks:
      - db_net

  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    container_name: bothub-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /data/files:/data/files
      # Только сокет лаунчера. docker.sock у ядра нет.
      - launcher-run:/run/bothub-launcher
    env_file: .env
    environment:
      LAUNCHER_SOCKET: /run/bothub-launcher/launcher.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db
      - launcher
    # default: порт для nginx на 127.0.0.1; db_net: Postgres. К сетям ботов (bothub-u-<владелец>)
    # ядро подключает лаунчер в рантайме под алиасом core и с отрицательным gw-priority (launcher.toml,
    # core_gw_priority). gw_priority 100 делает default шлюзом ядра: без него шлюзом может стать сеть
    # пользователя (при равном приоритете решает порядок сетей в Docker), и опубликованный порт перестаёт отвечать.
    # Нужны Docker 28+ и Compose 2.33+.
    networks:
      default:
        gw_priority: 100
      db_net:

  # Единственный сервис с docker.sock. Создаёт контейнеры ботов по фиксированному образцу и ставит правила
  # iptables для сетей ботов. Сеть хоста нужна, чтобы правила попали в netns хоста (DOCKER-USER, INPUT);
  # слушает лаунчер только unix-сокет в томе launcher-run (боты до него по сети не доходят).
  launcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.launcher
    container_name: bothub-launcher
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    network_mode: host
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      LAUNCHER_SECRET: ${LAUNCHER_SECRET:?задайте LAUNCHER_SECRET в deploy/.env (openssl rand -hex 32)}
      BOT_TOKEN_SECRET: ${BOT_TOKEN_SECRET:?задайте BOT_TOKEN_SECRET в deploy/.env}
      LAUNCHER_CONFIG: /etc/bothub-launcher/config.toml
      LAUNCHER_SOCKET: /run/bothub-launcher/launcher.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - launcher-run:/run/bothub-launcher
      - ./launcher.toml:/etc/bothub-launcher/config.toml:ro
      # seccomp-профиль ботов: Docker CLI читает его внутри этого контейнера (launcher.toml, [seccomp]).
      # Пересоздание лаунчера подхватывает правки, а уже запущенные боты получают профиль при recreate.
      - ./seccomp/bot.json:/etc/bothub-launcher/seccomp-bot.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.socket(socket.AF_UNIX); s.settimeout(5); s.connect('/run/bothub-launcher/launcher.sock'); s.sendall(b'GET /v1/health HTTP/1.0\\r\\n\\r\\n'); sys.exit(0 if b' 200 ' in s.recv(64) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3

  # Сборка образа ботов: docker compose --profile build build bot-image
  # Необязательный agy: AGY_URL и AGY_SHA256 в deploy/.env (см. README).
  bot-image:
    profiles: ["build"]
    image: bothub-bot
    build:
      context: ..
      dockerfile: bot-image/Dockerfile
      args:
        AGY_URL: ${AGY_URL:-}
        AGY_SHA256: ${AGY_SHA256:-}

volumes:
  pgdata:
  launcher-run:

networks:
  default:
    name: bothub_default
  db_net:
    name: bothub_db
    internal: true

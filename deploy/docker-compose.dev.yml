# Postgres для локальной разработки и тестов: docker compose -f deploy/docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bothub
      POSTGRES_PASSWORD: bothub
      POSTGRES_DB: bothub
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]

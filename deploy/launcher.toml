# Конфигурация лаунчера (монтируется read-only в контейнер launcher). Секретов здесь нет:
# LAUNCHER_SECRET и BOT_TOKEN_SECRET приходят из deploy/.env.
# Всё, что ниже, фиксировано на стороне сервера: из API образ, mounts, сеть и лимиты изменить нельзя.
# Описание: docs/isolation.md.

# Образ собирается так: docker compose --profile build build bot-image (или deploy/build-bot-image.sh).
image = "bothub-bot"

# Пользователь внутри контейнера бота. Root (0) запрещён, лаунчер не стартует.
user = "1000:1000"

# gVisor: после установки runsc (docs/isolation.md, раздел "gVisor") раскомментируйте.
# runtime = "runsc"

# Контейнер ядра. Лаунчер подключает его к сети каждого пользователя под именем core_alias;
# боты видят только TCP api_port ядра.
core_container = "bothub-core"
core_alias = "core"
core_url = "http://core:8080"
api_port = 8080

# Приоритет шлюза сети пользователя при подключении ядра (docker network connect --gw-priority, Docker 28+).
# У основной сети ядра в docker-compose.yml gw_priority 100, поэтому отрицательное значение оставляет её шлюзом
# по умолчанию. Должно быть меньше 100. На Docker старше 28 лаунчер флаг не передаёт и пишет предупреждение.
core_gw_priority = -100

# Внутренний DNS upstream, если он нужен стенду. Укажите настоящий IP резолвера в приватной сети;
# он должен разрешать и публичные имена: Docker не пробует следующий DNS после NXDOMAIN.
# 127.0.0.11 здесь не нужен: это встроенный DNS Docker внутри контейнера.
# internal_dns = "192.168.1.53"
# Публичные DNS upstream для ботов.
dns = ["1.1.1.1", "8.8.8.8"]

# Какой iptables использовать: такой же бэкенд, как у Docker на хосте.
# `iptables --version` на хосте: "(nf_tables)" это iptables / iptables-nft, "(legacy)" это iptables-legacy.
# iptables_bin = "iptables-legacy"
# ip6tables_bin = "ip6tables-legacy"

# seccomp-профиль контейнеров ботов (генерируется из moby-default.json: deploy/seccomp/build_profile.py).
# Открывает Chromium (uid 1001) user namespaces под cap-drop ALL, без --no-sandbox; коду бота (uid 1000) их
# закрывает bot-guard в образе. Путь внутри контейнера лаунчера: файл монтируется read-only из compose
# (./seccomp/bot.json), Docker CLI читает его у себя. Лаунчер не стартует, если файла нет или он не JSON с
# defaultAction. Через API профиль не меняется. Логин-контейнеры идут на стандартном профиле Docker.
# Описание: docs/isolation.md, раздел "Защита ядра".
[seccomp]
profile = "/etc/bothub-launcher/seccomp-bot.json"

[limits]
memory = "2g"
cpus = "2"
pids = 512
shm_size = "512m"
tmp_size = "512m"
run_size = "64m"

# Исключения из запрета на приватные адреса (по умолчанию закрыты RFC1918, 100.64.0.0/10, 169.254.0.0/16,
# loopback, multicast, IPv6 ULA и link-local). Каждое исключение расширяет доступ всех ботов: добавляйте
# узкие адреса с портом.
#
# [[allow]]
# cidr = "192.168.1.5/32"
# proto = "tcp"
# port = 11434
# comment = "Ollama в локальной сети"

# Исключения для доступа ботов к самому хосту (цепочка INPUT). По умолчанию хост закрыт полностью.
#
# [[host_allow]]
# cidr = "172.17.0.1/32"
# proto = "tcp"
# port = 9100
# comment = "node_exporter"

# Bot Hub на существующем поддомене: подключается одной строкой
#   include /etc/nginx/snippets/bothub-locations.conf;
# внутри server { } у bots.example.com. Ядро слушает 127.0.0.1:8080.
# snippets/sso-authrequest.conf: ваш сниппет с auth_request к SSO-провайдеру (создаёт оператор).

location = /bots { return 308 /bots/; }

# Mac-агент: свой токен, SSO-прокси не нужен (у агента нет cookie).
location = /bots/agent/mac {
    access_log off;
    proxy_set_header X-Bothub-Proxy "";
    proxy_set_header Remote-User "";
    proxy_pass http://127.0.0.1:8080/agent/mac;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Загрузка файлов Mac-агентом и ботами: авторизация токеном в ядре.
location = /bots/api/files {
    proxy_set_header X-Bothub-Proxy "";
    proxy_set_header Remote-User "";
    proxy_pass http://127.0.0.1:8080/api/files;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100m;
}

# Внешние триггеры: токен расписания в query.
location /bots/hooks/ {
    proxy_set_header X-Bothub-Proxy "";
    proxy_set_header Remote-User "";
    proxy_pass http://127.0.0.1:8080/hooks/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}

# Шлюз моделей снаружи закрыт: боты ходят на него напрямую в ядро по внутренней сети (алиас core),
# через nginx он не нужен. Открытый маршрут дал бы интернету доступ к провайдерам по украденному токену бота.
location ^~ /bots/gateway/ {
    return 404;
}

location /bots/api/ws {
    access_log off;
    include /etc/nginx/snippets/sso-authrequest.conf;
    include /etc/nginx/snippets/bothub-proxy-secret.conf;
    proxy_pass http://127.0.0.1:8080/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# PWA и API владельца: за SSO-прокси.
location /bots/ {
    include /etc/nginx/snippets/sso-authrequest.conf;
    # Секрет прокси только на сервере: /etc/nginx/snippets/bothub-proxy-secret.conf
    # (proxy_set_header X-Bothub-Proxy <BOTHUB_PROXY_SECRET из deploy/.env>;)
    include /etc/nginx/snippets/bothub-proxy-secret.conf;
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 100m;
}

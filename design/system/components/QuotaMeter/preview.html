<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font-sans)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.pad{padding:var(--space-4)}
.btn{min-height:var(--hit-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.btn-primary{background:var(--bg-emphasis);color:var(--fg-on-emphasis)}
.btn-secondary{background:var(--bg-surface);color:var(--fg-default);border-color:var(--border-control)}
.btn-ghost{background:transparent;color:var(--fg-default)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-approve{background:var(--attention-emphasis);color:var(--fg-on-attention)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:var(--hit-min);padding:0;border-radius:var(--radius-md)}
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 7px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.02em;line-height:1rem}
.p-claude{background:var(--claude-bg);color:var(--claude-fg)}
.p-codex{background:var(--codex-bg);color:var(--codex-fg)}
.p-gemini{background:var(--gemini-bg);color:var(--gemini-fg)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.muted{color:var(--fg-muted)}
.mono{font-family:var(--font-mono);font-size:.8125rem;line-height:1.125rem}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pad"><div class="card" style="padding:14px 16px;max-width:360px;display:flex;flex-direction:column;gap:10px">
<div class="row footnote muted" style="justify-content:space-between"><span>Квоты подписок на неделю</span><span>сброс пн 03:00</span></div>
<div class="row footnote" style="flex-wrap:nowrap;gap:10px"><span style="width:64px;font-weight:600">Claude</span><div role="meter" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100" aria-label="Claude: 42%" style="flex-grow:1;height:8px;background:var(--bg-sunken);border-radius:4px;overflow:hidden"><div style="height:8px;width:42%;background:var(--claude-fg);border-radius:4px"></div></div><span class="mono muted" style="width:40px;text-align:right">42%</span></div><div class="row footnote" style="flex-wrap:nowrap;gap:10px"><span style="width:64px;font-weight:600">Codex</span><div role="meter" aria-valuenow="18" aria-valuemin="0" aria-valuemax="100" aria-label="Codex: 18%" style="flex-grow:1;height:8px;background:var(--bg-sunken);border-radius:4px;overflow:hidden"><div style="height:8px;width:18%;background:var(--codex-fg);border-radius:4px"></div></div><span class="mono muted" style="width:40px;text-align:right">18%</span></div><div class="row footnote" style="flex-wrap:nowrap;gap:10px"><span style="width:64px;font-weight:600">Gemini</span><div role="meter" aria-valuenow="7" aria-valuemin="0" aria-valuemax="100" aria-label="Gemini: 7%" style="flex-grow:1;height:8px;background:var(--bg-sunken);border-radius:4px;overflow:hidden"><div style="height:8px;width:7%;background:var(--gemini-fg);border-radius:4px"></div></div><span class="mono muted" style="width:40px;text-align:right">7%</span></div>
<div class="row footnote" style="color:var(--attention-text);background:var(--attention-bg);border-radius:8px;padding:6px 10px">Кодер потратил 80% дневного бюджета</div>
</div></div>
<script>document.documentElement.setAttribute("lang","ru");</script>
</body>
</html>

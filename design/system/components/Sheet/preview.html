<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font-sans)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.pad{padding:var(--space-4)}
.btn{min-height:var(--hit-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.btn-primary{background:var(--bg-emphasis);color:var(--fg-on-emphasis)}
.btn-secondary{background:var(--bg-surface);color:var(--fg-default);border-color:var(--border-control)}
.btn-ghost{background:transparent;color:var(--fg-default)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-approve{background:var(--attention-emphasis);color:var(--fg-on-attention)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:var(--hit-min);padding:0;border-radius:var(--radius-md)}
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 7px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.02em;line-height:1rem}
.p-claude{background:var(--claude-bg);color:var(--claude-fg)}
.p-codex{background:var(--codex-bg);color:var(--codex-fg)}
.p-gemini{background:var(--gemini-bg);color:var(--gemini-fg)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.muted{color:var(--fg-muted)}
.mono{font-family:var(--font-mono);font-size:.8125rem;line-height:1.125rem}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div style="position:relative;height:400px;max-width:393px;background:var(--bg-canvas);overflow:hidden"><div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0, 0, 0, 0.35);"><section role="dialog" aria-modal="true" aria-labelledby="sh9" style="background: var(--bg-surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-sheet); padding: 8px 16px 34px; display: flex; flex-direction: column; gap: 12px; "><div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--border-control); flex-shrink: 0;"></div><div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;"><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;"><h2 id="sh9" style="margin: 0; font: 600 20px/26px 'Unbounded', 'Golos Text', sans-serif; letter-spacing: -0.01em; color: var(--fg-default);">Новый инвайт</h2><span style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">Ссылка одноразовая</span></div><button type="button" aria-label="Закрыть" style="width: 44px; height: 44px; padding: 0; flex-shrink: 0; border-radius: 12px; background: transparent; color: var(--fg-default); border: none; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;"><label for="f8" style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">Для кого</label><div style="display: flex; gap: 8px; align-items: center;"><input id="f8" type="text" value="Миша" placeholder="" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--fg-default); font: 400 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; "></div></div><div role="radiogroup" aria-label="Срок ссылки" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg-sunken); flex-shrink: 0;"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 6px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--fg-default); font: 500 14px/18px 'Golos Text', -apple-system, system-ui, sans-serif;">1 день</button><button type="button" role="radio" aria-checked="true" style="min-height: 44px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--fg-default); font: 600 14px/18px 'Golos Text', -apple-system, system-ui, sans-serif;">3 дня</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 6px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--fg-default); font: 500 14px/18px 'Golos Text', -apple-system, system-ui, sans-serif;">7 дней</button></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--bg-surface); color: var(--fg-default); border: 1px solid var(--border-control); font: 500 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; white-space: nowrap; ">Отмена</button><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--bg-emphasis); color: var(--fg-on-emphasis); border: 1px solid transparent; font: 600 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; white-space: nowrap; ">Создать ссылку</button></div></section></div></div>
<script>document.documentElement.setAttribute("lang","ru");</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font-sans)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.pad{padding:var(--space-4)}
.btn{min-height:var(--hit-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.btn-primary{background:var(--bg-emphasis);color:var(--fg-on-emphasis)}
.btn-secondary{background:var(--bg-surface);color:var(--fg-default);border-color:var(--border-control)}
.btn-ghost{background:transparent;color:var(--fg-default)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-approve{background:var(--attention-emphasis);color:var(--fg-on-attention)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:var(--hit-min);padding:0;border-radius:var(--radius-md)}
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 7px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.02em;line-height:1rem}
.p-claude{background:var(--claude-bg);color:var(--claude-fg)}
.p-codex{background:var(--codex-bg);color:var(--codex-fg)}
.p-gemini{background:var(--gemini-bg);color:var(--gemini-fg)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.muted{color:var(--fg-muted)}
.mono{font-family:var(--font-mono);font-size:.8125rem;line-height:1.125rem}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pad"><div style="max-width:360px;display:flex;flex-direction:column;gap:12px"><div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;"><label for="f1" style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">Логин</label><div style="display: flex; gap: 8px; align-items: center;"><input id="f1" type="text" value="admin" placeholder="" aria-describedby="f1n" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--fg-default); font: 400 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; "></div><span id="f1n" style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">Латиница и цифры, от 3 символов</span></div><div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;"><label for="f2" style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">Пароль</label><div style="display: flex; gap: 8px; align-items: center;"><input id="f2" type="password" value="000000000000" placeholder="" aria-describedby="f2n" aria-invalid="true" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid var(--danger-fg); background: var(--bg-surface); color: var(--fg-default); font: 400 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; "><button type="button" aria-label="Показать пароль" style="width: 44px; height: 44px; padding: 0; flex-shrink: 0; border-radius: 12px; background: transparent; color: var(--fg-default); border: none; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div><span id="f2n" style="display: flex; align-items: center; gap: 6px; font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted); color: var(--danger-fg);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>Логин или пароль не подходят</span></div><div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;"><label for="f3" style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">Base URL</label><div style="display: flex; gap: 8px; align-items: center;"><input id="f3" type="text" value="http://192.168.1.20:11434/v1" placeholder="" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--fg-default); font: 400 15px/20px 'JetBrains Mono', ui-monospace, Menlo, monospace; "></div></div><div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;"><label for="f4" style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">Название</label><div style="display: flex; gap: 8px; align-items: center;"><input id="f4" type="text" value="Anthropic API" placeholder="" disabled style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--fg-default); font: 400 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; opacity: 0.6;"></div></div></div></div>
<script>document.documentElement.setAttribute("lang","ru");</script>
</body>
</html>

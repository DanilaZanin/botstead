<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font-sans)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.pad{padding:var(--space-4)}
.btn{min-height:var(--hit-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.btn-primary{background:var(--bg-emphasis);color:var(--fg-on-emphasis)}
.btn-secondary{background:var(--bg-surface);color:var(--fg-default);border-color:var(--border-control)}
.btn-ghost{background:transparent;color:var(--fg-default)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-approve{background:var(--attention-emphasis);color:var(--fg-on-attention)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:var(--hit-min);padding:0;border-radius:var(--radius-md)}
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 7px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.02em;line-height:1rem}
.p-claude{background:var(--claude-bg);color:var(--claude-fg)}
.p-codex{background:var(--codex-bg);color:var(--codex-fg)}
.p-gemini{background:var(--gemini-bg);color:var(--gemini-fg)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.muted{color:var(--fg-muted)}
.mono{font-family:var(--font-mono);font-size:.8125rem;line-height:1.125rem}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.spin{display:inline-flex;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="pad" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:960px"><div class="card" style="min-height:260px;display:flex;flex-direction:column;padding:12px"><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center;"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; background: var(--bg-sunken); color: var(--fg-muted); display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 01-12 0zM12 17v4"></path></svg></span><span style="font: 600 17px/22px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-default);">Провайдеров нет</span><span style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted); max-width: 300px;">Боты не смогут отвечать, пока не подключена хотя бы одна модель.</span><div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;"><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--bg-emphasis); color: var(--fg-on-emphasis); border: 1px solid transparent; font: 600 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; white-space: nowrap; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 5v14M5 12h14"></path></svg>Добавить провайдера</button></div></div></div><div class="card" style="min-height:260px;display:flex;flex-direction:column;padding:12px"><div role="status" aria-busy="true" style="display: flex; flex-direction: column; gap: 10px;"><span style="display: flex; align-items: center; gap: 8px; font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);"><span class="spin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3a9 9 0 109 9"></path></svg></span>Проверяю провайдеров</span><div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 16px; height: 56px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; justify-content: center; flex-shrink: 0;"><span style="width: 55%; height: 12px; border-radius: 6px; background: var(--bg-sunken);"></span><span style="width: 80%; height: 10px; border-radius: 5px; background: var(--bg-sunken);"></span></div><div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 16px; height: 56px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; justify-content: center; flex-shrink: 0;"><span style="width: 48%; height: 12px; border-radius: 6px; background: var(--bg-sunken);"></span><span style="width: 71%; height: 10px; border-radius: 5px; background: var(--bg-sunken);"></span></div><div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 16px; height: 56px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; justify-content: center; flex-shrink: 0;"><span style="width: 41%; height: 12px; border-radius: 6px; background: var(--bg-sunken);"></span><span style="width: 62%; height: 10px; border-radius: 5px; background: var(--bg-sunken);"></span></div></div></div><div class="card" style="min-height:260px;display:flex;flex-direction:column;padding:12px"><div role="alert" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center;"><span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; background: var(--danger-bg); color: var(--danger-fg); display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg></span><span style="font: 600 17px/22px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-default);">Провайдеры не загрузились</span><span style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted); max-width: 300px;">Сервер не ответил за 10 с. Боты работают на прежних моделях.</span><div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;"><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--bg-surface); color: var(--fg-default); border: 1px solid var(--border-control); font: 500 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; white-space: nowrap; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M20 11a8 8 0 00-14.5-4M4 4v4h4"></path><path d="M4 13a8 8 0 0014.5 4M20 20v-4h-4"></path></svg>Повторить</button></div></div></div></div>
<script>document.documentElement.setAttribute("lang","ru");</script>
</body>
</html>

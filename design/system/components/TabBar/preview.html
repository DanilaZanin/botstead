<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font-sans)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.pad{padding:var(--space-4)}
.btn{min-height:var(--hit-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.btn-primary{background:var(--bg-emphasis);color:var(--fg-on-emphasis)}
.btn-secondary{background:var(--bg-surface);color:var(--fg-default);border-color:var(--border-control)}
.btn-ghost{background:transparent;color:var(--fg-default)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-approve{background:var(--attention-emphasis);color:var(--fg-on-attention)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:var(--hit-min);padding:0;border-radius:var(--radius-md)}
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 7px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.02em;line-height:1rem}
.p-claude{background:var(--claude-bg);color:var(--claude-fg)}
.p-codex{background:var(--codex-bg);color:var(--codex-fg)}
.p-gemini{background:var(--gemini-bg);color:var(--gemini-fg)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.muted{color:var(--fg-muted)}
.mono{font-family:var(--font-mono);font-size:.8125rem;line-height:1.125rem}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div style="padding:var(--space-4) 0;background:linear-gradient(var(--claude-bg),var(--gemini-bg))"><nav aria-label="Разделы" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px 10px;background:var(--bg-glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--border-default);max-width:390px"><a href="#" aria-current="page" class="caption" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;justify-content:center;text-decoration:none;position:relative;color:var(--fg-default)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01"/></svg>Боты</a><a href="#"  class="caption" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;justify-content:center;text-decoration:none;position:relative;color:var(--fg-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Рутины</a><a href="#"  class="caption" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;justify-content:center;text-decoration:none;position:relative;color:var(--fg-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>Решения<span class="dot" style="position:absolute;top:2px;right:28%;background:var(--attention-fg)" aria-label="есть ожидающие"></span></a><a href="#"  class="caption" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;justify-content:center;text-decoration:none;position:relative;color:var(--fg-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Расход</a></nav></div>
<script>document.documentElement.setAttribute("lang","ru");</script>
</body>
</html>

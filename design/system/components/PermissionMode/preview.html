<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font-sans)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.pad{padding:var(--space-4)}
.btn{min-height:var(--hit-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.btn-primary{background:var(--bg-emphasis);color:var(--fg-on-emphasis)}
.btn-secondary{background:var(--bg-surface);color:var(--fg-default);border-color:var(--border-control)}
.btn-ghost{background:transparent;color:var(--fg-default)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-approve{background:var(--attention-emphasis);color:var(--fg-on-attention)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:var(--hit-min);padding:0;border-radius:var(--radius-md)}
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 7px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.02em;line-height:1rem}
.p-claude{background:var(--claude-bg);color:var(--claude-fg)}
.p-codex{background:var(--codex-bg);color:var(--codex-fg)}
.p-gemini{background:var(--gemini-bg);color:var(--gemini-fg)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.muted{color:var(--fg-muted)}
.mono{font-family:var(--font-mono);font-size:.8125rem;line-height:1.125rem}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pad"><div style="max-width:520px;display:flex;flex-direction:column;gap:12px"><div class="row" style="flex-wrap:nowrap;gap:12px"><button type="button" aria-haspopup="dialog" style="min-height: 44px; padding: 0 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--fg-default); font: 500 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;"><span style="color: var(--success-fg); display: flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M5 12l5 5 9-10"></path></svg></span>Без вопроса<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 9l6 6 6-6"></path></svg></button><span class="footnote muted">Бот делает сам. Действие видно в ленте.</span></div><div class="row" style="flex-wrap:nowrap;gap:12px"><button type="button" aria-haspopup="dialog" style="min-height: 44px; padding: 0 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--fg-default); font: 500 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;"><span style="color: var(--attention-fg); display: flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"></path><path d="M9 12l2 2 4-4"></path></svg></span>Спросить<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 9l6 6 6-6"></path></svg></button><span class="footnote muted">Перед каждым действием придёт запрос.</span></div><div class="row" style="flex-wrap:nowrap;gap:12px"><button type="button" aria-haspopup="dialog" style="min-height: 44px; padding: 0 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--fg-default); font: 500 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;"><span style="color: var(--fg-muted); display: flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>По команде<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 9l6 6 6-6"></path></svg></button><span class="footnote muted">Только если попросить об этом прямо в сообщении.</span></div><div class="row" style="flex-wrap:nowrap;gap:12px"><button type="button" aria-haspopup="dialog" style="min-height: 44px; padding: 0 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--fg-default); font: 500 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;"><span style="color: var(--danger-fg); display: flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg></span>Запрещено<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 9l6 6 6-6"></path></svg></button><span class="footnote muted">Инструмент выключен. Бот скажет, что не может.</span></div><div class="row" style="flex-wrap:nowrap;gap:12px"><button type="button" aria-haspopup="dialog" style="min-height: 44px; padding: 0 10px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--fg-default); font: 500 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;"><span style="color: var(--attention-fg); display: flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg></span>Спросить</button><span class="footnote muted">Неотключаемый список: режим сменить нельзя.</span></div></div></div>
<script>document.documentElement.setAttribute("lang","ru");</script>
</body>
</html>

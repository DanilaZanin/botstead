<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Golos+Text:wght@400&display=swap">
<style>
body{margin:0;background:var(--bg-canvas)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg-canvas)}
svg{position:absolute;left:0;top:0}
.ink{fill:var(--bg-emphasis)}
.claude{fill:var(--claude-fg)}
.codex{fill:var(--codex-fg)}
.gemini{fill:var(--gemini-fg)}
.attn{fill:var(--attention-emphasis)}
.tile{rx:var(--radius-lg);ry:var(--radius-lg)}
.cut{fill:var(--bg-canvas)}
.text{position:absolute;left:48px;bottom:40px;max-width:440px;display:flex;flex-direction:column;gap:12px}
.name{margin:0;font-family:var(--font-display);font-weight:600;font-size:88px;line-height:.95;letter-spacing:-0.03em;color:var(--fg-default)}
.tag{margin:0;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--fg-muted)}
</style>
</head>
<body>
<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: bg-emphasis 192x304 slab; claude-fg 128x144; codex-fg 160x144 (bleeds right); gemini-fg 176x128; attention-emphasis 80x64 -->
<!-- arrangement: one tall ink slab with provider tiles as satellites, top and right edges bleed like cards scrolling off a list -->
<!-- pattern: dot grid, the "precise, technical, mono, grid" row: a bot fleet reads like a rack of machines, dots cut from the slab in bg-canvas -->
<!-- scales: gaps space-4 (16), dot pitch space-5 (24), dot r 3, tiles radius-lg (16) -->
<rect class="ink tile" x="480" y="-16" width="192" height="304"/>
<rect class="claude tile" x="688" y="-16" width="128" height="144"/>
<rect class="codex tile" x="832" y="-16" width="160" height="144"/>
<rect class="gemini tile" x="688" y="144" width="176" height="128"/>
<rect class="attn tile" x="880" y="144" width="80" height="64"/>
<g class="cut">
<circle cx="504" cy="144" r="3"/><circle cx="528" cy="144" r="3"/><circle cx="552" cy="144" r="3"/><circle cx="576" cy="144" r="3"/><circle cx="600" cy="144" r="3"/><circle cx="624" cy="144" r="3"/><circle cx="648" cy="144" r="3"/>
<circle cx="504" cy="168" r="3"/><circle cx="528" cy="168" r="3"/><circle cx="552" cy="168" r="3"/><circle cx="576" cy="168" r="3"/><circle cx="600" cy="168" r="3"/><circle cx="624" cy="168" r="3"/><circle cx="648" cy="168" r="3"/>
<circle cx="504" cy="192" r="3"/><circle cx="528" cy="192" r="3"/><circle cx="552" cy="192" r="3"/><circle cx="576" cy="192" r="3"/><circle cx="600" cy="192" r="3"/><circle cx="624" cy="192" r="3"/><circle cx="648" cy="192" r="3"/>
<circle cx="504" cy="216" r="3"/><circle cx="528" cy="216" r="3"/><circle cx="552" cy="216" r="3"/><circle cx="576" cy="216" r="3"/><circle cx="600" cy="216" r="3"/><circle cx="624" cy="216" r="3"/><circle cx="648" cy="216" r="3"/>
<circle cx="504" cy="240" r="3"/><circle cx="528" cy="240" r="3"/><circle cx="552" cy="240" r="3"/><circle cx="576" cy="240" r="3"/><circle cx="600" cy="240" r="3"/><circle cx="624" cy="240" r="3"/><circle cx="648" cy="240" r="3"/>
<circle cx="504" cy="264" r="3"/><circle cx="528" cy="264" r="3"/><circle cx="552" cy="264" r="3"/><circle cx="576" cy="264" r="3"/><circle cx="600" cy="264" r="3"/><circle cx="624" cy="264" r="3"/><circle cx="648" cy="264" r="3"/>
</g>
</svg>
<div class="text">
<h1 class="name">Bot Hub</h1>
<p class="tag">Пульт для личной команды AI-ботов: Claude, Codex и Gemini на своём сервере</p>
</div>
</div>
<script>document.documentElement.setAttribute("lang","ru");</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font-sans)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
.pad{padding:var(--space-4)}
.btn{min-height:var(--hit-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.btn-primary{background:var(--bg-emphasis);color:var(--fg-on-emphasis)}
.btn-secondary{background:var(--bg-surface);color:var(--fg-default);border-color:var(--border-control)}
.btn-ghost{background:transparent;color:var(--fg-default)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-approve{background:var(--attention-emphasis);color:var(--fg-on-attention)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:var(--hit-min);padding:0;border-radius:var(--radius-md)}
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 7px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.02em;line-height:1rem}
.p-claude{background:var(--claude-bg);color:var(--claude-fg)}
.p-codex{background:var(--codex-bg);color:var(--codex-fg)}
.p-gemini{background:var(--gemini-bg);color:var(--gemini-fg)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.muted{color:var(--fg-muted)}
.mono{font-family:var(--font-mono);font-size:.8125rem;line-height:1.125rem}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pad"><div style="max-width:360px;display:flex;flex-direction:column;gap:12px"><div style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 16px; padding: 4px 14px; display: flex; flex-direction: column; gap: 0px; flex-shrink: 0; "><div style="display: flex; align-items: center; gap: 12px; min-height: 44px; flex-grow: 1; min-width: 0; "><span id="s5" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font: 400 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-default);">Opus 5.5</span><span style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">claude-opus-5-5 · контекст 200k</span></span><button type="button" role="switch" aria-checked="true" aria-labelledby="s5" style="width: 52px; height: 44px; padding: 6px 0; flex-shrink: 0; border: none; background: transparent; display: flex; align-items: center;"><span style="width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; padding: 3px; display: flex; align-items: center; background: var(--bg-emphasis); border: 1px solid transparent; justify-content: flex-end;"><span style="width: 24px; height: 24px; border-radius: 12px; background: var(--fg-on-emphasis);"></span></span></button></div><div style="display: flex; align-items: center; gap: 12px; min-height: 44px; flex-grow: 1; min-width: 0; "><span id="s6" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font: 400 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-default);">Haiku 5</span><span style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">claude-haiku-5 · контекст 200k</span></span><button type="button" role="switch" aria-checked="false" aria-labelledby="s6" style="width: 52px; height: 44px; padding: 6px 0; flex-shrink: 0; border: none; background: transparent; display: flex; align-items: center;"><span style="width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; padding: 3px; display: flex; align-items: center; background: var(--bg-surface); border: 1px solid var(--border-control); justify-content: flex-start;"><span style="width: 24px; height: 24px; border-radius: 12px; background: var(--fg-muted);"></span></span></button></div><div style="display: flex; align-items: center; gap: 12px; min-height: 44px; flex-grow: 1; min-width: 0; opacity: 0.5;"><span id="s7" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="font: 400 15px/20px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-default);">Opus 5</span><span style="font: 400 13px/18px 'Golos Text', -apple-system, system-ui, sans-serif; color: var(--fg-muted);">провайдер недоступен</span></span><button type="button" role="switch" aria-checked="false" aria-labelledby="s7" disabled style="width: 52px; height: 44px; padding: 6px 0; flex-shrink: 0; border: none; background: transparent; display: flex; align-items: center;"><span style="width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; padding: 3px; display: flex; align-items: center; background: var(--bg-surface); border: 1px solid var(--border-control); justify-content: flex-start;"><span style="width: 24px; height: 24px; border-radius: 12px; background: var(--fg-muted);"></span></span></button></div></div></div></div>
<script>document.documentElement.setAttribute("lang","ru");</script>
</body>
</html>

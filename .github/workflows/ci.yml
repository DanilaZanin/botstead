name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bothub
          POSTGRES_PASSWORD: bothub
          POSTGRES_DB: bothub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bothub -d bothub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run core tests
        env:
          DATABASE_URL: postgresql://bothub:bothub@127.0.0.1:5432/bothub_test
        run: cd core && uv run --with pytest-timeout pytest -q -p no:cacheprovider --timeout=180

  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run launcher tests
        run: cd launcher && uv run --with pytest --with pytest-asyncio --with fastapi --with httpx pytest -q

  bot-image:
    name: Bot Image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure C compiler is available
        run: which gcc || (sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev)
      - name: Run bot-image tests
        run: cd bot-image && uv run --no-project --with pytest pytest -q tests

  seccomp-profile:
    name: Seccomp Profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check seccomp profile
        run: python3 deploy/seccomp/build_profile.py --check

  publish-export:
    name: Publish Export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test publish export
        # The publishing tools are not part of the public tree: run only where they exist.
        run: if [ -f scripts/publish/test_export.sh ]; then bash scripts/publish/test_export.sh; else echo "publishing tools are absent, skipped"; fi

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies and Playwright browser
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: |
          cd e2e
          npx playwright test --reporter=line --retries=2
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint Python with Ruff
        run: uvx ruff check .
      - name: Check bash syntax
        run: find deploy bot-image scripts -type f -name "*.sh" -exec bash -n {} +
      - name: Run shellcheck
        run: find deploy bot-image scripts -type f -name "*.sh" -exec shellcheck --severity=error {} +

[project]
name = "bothub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "pydantic>=2.8",
  "croniter>=3.0",
  "httpx>=0.27",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "pywebpush>=2.0",
  "mcp>=1.2",
  "argon2-cffi>=25.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["pure: tests that do not require Postgres", "empty_users: database test starts before setup"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bothub"]

[project]
name = "bothub-launcher"
version = "0.1.0"
description = "Сервис создания контейнеров ботов Bot Hub: единственный владелец docker.sock"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# интеграционные тесты с настоящим Docker по умолчанию пропускаются: pytest -m docker
addopts = "-m 'not docker'"
markers = ["docker: нужен настоящий Docker daemon (хост Linux, права на docker.sock и iptables)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bothub_launcher"]
